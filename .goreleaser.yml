---
project_name: astro-stacker

release:
  extra_files:
    - glob: ./LICENSE
  github:
    owner: USA-RedDragon
    name: astro-stacker

# Images are amd64 only: Siril, which does the calibration and
# registration, only ships an x86_64 AppImage.
dockers:
  - image_templates:
      - "ghcr.io/usa-reddragon/astro-stacker:{{ .Tag }}-amd64"
      - "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}-amd64"
      - "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/usa-reddragon/astro-stacker:latest-amd64"
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - --label=org.opencontainers.image.licenses=MIT
      - --label=org.opencontainers.image.url=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - "--platform=linux/amd64"

docker_manifests:
  - name_template: "ghcr.io/usa-reddragon/astro-stacker:{{ .Tag }}"
    image_templates:
      - "ghcr.io/usa-reddragon/astro-stacker:{{ .Tag }}-amd64"
  - name_template: "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}"
    image_templates:
      - "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}-amd64"
  - name_template: "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/usa-reddragon/astro-stacker:v{{ .Major }}.{{ .Minor }}-amd64"
  - name_template: "ghcr.io/usa-reddragon/astro-stacker:latest"
    image_templates:
      - "ghcr.io/usa-reddragon/astro-stacker:latest-amd64"

builds:
  - main: .
    binary: astro-stacker
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    goarm:
      - "6"
      - "7"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath

milestones:
  - close: true
