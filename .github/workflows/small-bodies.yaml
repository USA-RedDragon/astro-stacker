name: Small bodies

on:
  pull_request:
    paths:
      - smallbodies/**
      - .github/workflows/small-bodies.yaml
  push:
    branches:
      - main
    paths:
      - smallbodies/**
      - .github/workflows/small-bodies.yaml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.1"
      - working-directory: smallbodies
        run: |
          pip install -r requirements.txt pytest==9.1.1
          python -m pytest -q

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      push: ${{ github.event_name != 'pull_request' }}
      image-name: usa-reddragon/astro-small-bodies
      dockerfile: smallbodies/Dockerfile
      context: smallbodies
      platforms: linux/amd64
      version: ${{ github.ref_name == 'main' && 'beta' || '' }}
