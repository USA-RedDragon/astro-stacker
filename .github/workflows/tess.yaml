name: TESS vetting

on:
  pull_request:
    paths:
      - tessjob/**
      - .github/workflows/tess.yaml
  push:
    branches:
      - main
    paths:
      - tessjob/**
      - .github/workflows/tess.yaml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - working-directory: tessjob
        run: |
          pip install -r requirements.txt pytest==9.1.1
          python -m pytest -q

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    with:
      push: ${{ github.event_name != 'pull_request' }}
      image-name: usa-reddragon/astro-tess
      dockerfile: tessjob/Dockerfile
      context: tessjob
      platforms: linux/amd64
      version: ${{ github.ref_name == 'main' && 'beta' || '' }}
