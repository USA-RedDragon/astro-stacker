name: TESS vetting

on:
  pull_request:
    paths:
      - tessjob/**
      - .github/workflows/tess.yaml
  push:
    branches:
      - main
    paths:
      - tessjob/**
      - .github/workflows/tess.yaml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
      - working-directory: tessjob
        run: |
          pip install -r requirements.txt pytest==9.1.1
          python -m pytest -q

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      push: ${{ github.event_name != 'pull_request' }}
      image-name: usa-reddragon/astro-tess
      dockerfile: tessjob/Dockerfile
      context: tessjob
      platforms: linux/amd64
      version: ${{ github.ref_name == 'main' && 'beta' || '' }}
