# Sample configuration
# Logging level for the application. One of debug, info, warn, or error
log-level: "info"
# HTTP server configuration
http:
  # Address to listen on
  bind: "[::]"
  # Port to listen on
  port: 8080
  # Trusted proxies for the HTTP server
  # trusted-proxies: []
  # The web app that the old web UI paths redirect to
  web-url: "https://astro-processing.jackal-stargazer.ts.net"
# Metrics server configuration
metrics:
  # Enable metrics server
  enabled: false
  # Address to listen on
  bind: "127.0.0.1"
  # Port to listen on
  port: 9000
# PProf server configuration
pprof:
  # Enable pprof server
  enabled: false
  # Address to listen on
  bind: "127.0.0.1"
  # Port to listen on
  port: 9999
# Storage configuration
storage:
  # Storage type. One of mysql, postgres, sqlite
  type: "sqlite"
  # Storage type of the scheduler database, if different from type
  # schedulerdb-type: ""
  # Data source names for the storage
  dsn:
    # Data source name for the application storage
    app: ":memory:?_pragma=foreign_keys(1)"
    # Data source name for the scheduler database
    schedulerdb: ":memory:?_pragma=foreign_keys(1)"
# Object store holding the raw frames
s3:
  # S3 endpoint host, without scheme
  endpoint: "s3.mcswain.dev"
  # Use HTTPS for the S3 endpoint
  use-ssl: true
  # S3 region
  region: "us-east-1"
  # Bucket holding the raw frames
  bucket: "astro"
  # S3 access key
  # access-key: ""
  # S3 secret key
  # secret-key: "(secret)"
  # Bucket for previews and processed frames
  processed-bucket: "astro-processed"
  # S3 host browsers use for presigned URLs
  public-endpoint: "s3.mcswain.dev"
  # Presigned URLs use HTTPS
  public-use-ssl: true
# Frame indexer configuration
indexer:
  # Index frame headers from the bucket
  enabled: false
  # Seconds between bucket scans
  interval-seconds: 600
  # Seconds between listings of the folders of targets imaged in the last two days, so new lights are indexed, previewed and scored soon after upload; 0 waits for the bucket scan
  recent-seconds: 15
  # Headers to fetch in parallel
  concurrency: 8
# Sub preview rendering
previews:
  # Render auto-stretched JPEG previews of lights into the processed bucket
  enabled: false
  # Seconds between checks for frames without previews
  interval-seconds: 120
  # Frames rendered in parallel; each needs about 200 MB
  concurrency: 2
  # Preview width in pixels
  max-width: 1280
  # JPEG quality
  quality: 80
  # Lifetime of presigned preview URLs
  url-ttl-seconds: 3600
# Calibrating, registering and stacking lights into one master per target and filter
stacking:
  # Stack good lights into masters as they arrive
  enabled: false
  # Seconds between checks for new lights when idle
  interval-seconds: 120
  # Lowest sub score (0-1) that goes into a master
  min-score: 0.3
  # Score subs per second of exposure against every sub of the same filter and gain, instead of against subs of the same filter and exposure, so a target's subs of different lengths weigh fairly in one master; turning it on or off scores every master's subs again
  score-per-second: false
  # Subs calibrated and registered per Siril run
  batch-size: 12
  # Scratch space for downloads, masters and Siril output
  work-dir: "/tmp/stacking"
  # siril-cli, or an extracted Siril AppImage's AppRun
  siril-command: "siril-cli"
  # Threads Siril may use
  siril-threads: 4
  # Share of memory all Siril runs together may use (Siril reads the container limit); registration needs about 320 MiB per thread
  siril-memory: 0.5
  # Directory astrometry.net's index files (about 1.1 GB) are downloaded to and checked in at startup; masters Siril can't plate solve are solved with solve-field from them. Empty turns it off
  # astrometry-index-dir: ""
  # astrometry.net's solve-field
  astrometry-command: "solve-field"
  # CPU seconds one solve-field run may use; runs are one at a time, on one core
  astrometry-cpu-seconds: 120
  # Seconds one solve-field run may take
  astrometry-timeout-seconds: 300
  # Targets stacked at once; each holds up to about 1.5 GB besides Siril
  workers: 1
  # Minutes between backstop checks for mosaics, linear fits and comet masters to build; a master update or new frames start a check about a minute later, at most every five minutes; 0 turns mosaics off
  mosaic-minutes: 10
  # Minimum minutes between rebuilds of a mosaic whose panel masters keep changing; a new panel rebuilds it at once
  mosaic-quiet-minutes: 30
  # Measure seam health on mosaics already built, one per mosaic check and only while no target is stacking; new builds measure their seams either way
  mosaic-seams: true
  # Camera pedestal in ADU at offset 50, for scoring subs with no master bias measured at their gain and offset
  pedestal: 506
  # Minutes a flat, dark or bias set must go without a new frame before a master is built from it; lights it matches wait meanwhile
  calibration-settle-minutes: 180
  # Most stacked lights waiting at once to be calibrated again with a better dark; more are queued as they clear
  recalibrate-limit: 300
  # Check each settled flat set for dust that came, went or moved since the last flat of its filter, and each night's lights for dust their flats don't hold
  dust-check: true
  # On shutdown, seconds to let the stacker finish the batch, master, mosaic or comet it is on before cancelling it
  drain-seconds: 1200
  # Leave out lights taken on or after this date (YYYY-MM-DD, UTC) whose sensor was more than 0.5 °C off its setpoint, and take such lights out of masters; older lights are stacked as before; empty turns the rule off
  reject-off-temp-since: "2026-10-13"
  # Tell Target Scheduler which subs were left out for low score or moon: off, dry-run (log what would be sent) or on
  ts-verdicts: "off"
  # Only subs taken on or after this date (YYYY-MM-DD, UTC); empty for all
  # ts-verdicts-since: ""
  # Only subs of these targets; empty for all
  # ts-verdicts-targets: []
  # Most new verdicts sent in any hour; a sweep runs about a minute after lights are triaged or Target Scheduler's images sync in, at most every five minutes, and hourly
  ts-verdicts-max: 200
  # Hours a registered sub no stacked sub references is kept before it is deleted; 0 keeps them all
  registered-grace-hours: 24
  # Milliseconds between deletions of unreferenced registered subs
  registered-delete-pause-ms: 200
  # Stacked subs per second converted from 32-bit FITS to 16-bit XISF; 0 stops the conversion
  registered-backfill-rate: 0.5
# Small watermarked frames of each target's newest accepted light, for the public site
public-frames:
  # Render each recently imaged target's newest accepted light as a small watermarked JPEG in the processed bucket, served at /api/v1/public-light.jpg
  enabled: false
  # Seconds between backstop checks for newly accepted lights; a check also runs as soon as lights are triaged
  interval-seconds: 60
  # Targets with an accepted light from the last this many days get a frame; older frames are kept but not re-rendered
  max-age-days: 14
# Catalogue completion, the target finder and Starfront collaborations
discover:
  # Observatory latitude in degrees; with site-longitude 0 too, the site is read from the newest light's FITS header (SITELAT, SITELONG)
  # site-latitude: 0.0
  # Observatory east longitude in degrees
  # site-longitude: 0.0
  # Observatory elevation in metres; unset reads SITEELEV from the newest light when the site comes from its header, and leaves the elevation unknown otherwise
  # site-elevation: 0.0
  # Altitude in degrees an object must clear in astronomical darkness to count as up
  min-altitude: 30
  # Override for the dark-sky brightness in mag/arcsec²; 0 measures it from broadband (L, G, R, B) masters' zero points and their subs' sky
  # sky-brightness: 0.0
  # Ignored: the focal length is read from lights' FOCALLEN
  # focal-length: 0.0
  # Ignored: the pixel size is read from lights' XPIXSZ
  # pixel-size: 0.0
  # Ignored: the image width is read from lights' headers
  # sensor-width: 0
  # Ignored: the image height is read from lights' headers
  # sensor-height: 0
  # Ignored: a colour camera is recognised by BAYERPAT in lights' headers
  colour: false
  # Filter bandpasses in nm for collaboration limits (H=3); which filters are on the wheel is read from lights
  # filters: []
  # Ignored: the typical HFR is measured from recent lights
  # typical-hfr: 0.0
  # Ignored: the typical guiding RMS is read from Target Scheduler's records of recent lights
  # typical-guide-rms: 0.0
  # Ignored: sub lengths per filter are read from recent lights
  # exposures: []
  # Read Starfront's public collaboration list for the Collabs page; read-only, no account
  starfront: true
  # Starfront collaboration server
  starfront-url: "https://collab.starfront.space"
  # Minutes between fetches of the collaboration list
  starfront-minutes: 30
  # Fetch the Finkbeiner 2003 H-α all-sky map once from CDS and cache it in the database, for the Finder's H-α column and score
  halpha-map: true
  # Serve DSS2 colour survey cutouts for framing previews, rendered from the S3 survey mirror or else fetched from CDS hips2fits and cached in the database
  sky-cutouts: true
  # CDS hips2fits service for the H-α map and survey cutouts
  hips2fits-url: "https://alasky.cds.unistra.fr/hips-image-services/hips2fits"
  # Most survey cutouts fetched from hips2fits per minute; cached ones and ones rendered from the S3 mirror are served without limit
  cutouts-per-minute: 60
  # Render survey cutouts from the DSS2 colour HiPS tiles mirrored in S3 when a mirrored order is as fine as one output pixel; finer fields and mirror misses come from hips2fits
  survey-mirror: true
  # S3 bucket holding the survey mirror, read with the s3 credentials
  survey-bucket: "sky-survey"
  # Path of the DSS2 colour HiPS inside the survey bucket
  survey-prefix: "hips/CDS_P_DSS2_color"
  # Deepest HiPS order in the survey mirror
  survey-max-order: 8
  # Memory for decoded survey tiles, in MB
  survey-cache-mb: 100
# The observatory-scheduler plugin's API and the durable command queue
scheduler:
  # Base URL of the observatory-scheduler plugin's API, e.g. http://observatory:8189; empty leaves the scheduler unconfigured and commands queued
  # url: ""
  # Bearer token for the plugin's API
  # token: ""
  # Also write commands to the scheduler database's ts_command table, which SymmetricDS carries to the observatory
  queue: true
  # Prometheus or Thanos query URL holding the observatory's weather, safety monitor, mount and UPS metrics, e.g. http://thanos-querier-app.monitoring:9090; empty shows those cards with no data source
  # metrics-url: ""
  # The ups label of the observatory UPS in the NUT exporter's metrics
  ups: "observatory"
  # Base URL of NINA's Advanced API on the observatory PC, e.g. http://observatory:1888/v2/api, for the collab switch on the Collabs page; empty leaves the switch unconfigured
  # nina-url: ""
# Faint-signal SNR and depth of every master, measured from random half stacks of its registered subs, and progress toward Target Scheduler goals
goals:
  # Measure each master's faint-signal SNR, noise curve and depth into goal_measurements, again when it grows 20% in effective hours
  enabled: false
  # Minutes between backstop checks for masters to measure; a master is measured about a minute after it is updated or its goal changes, and again as soon as it has subs for another noise draw level while its noise floor can't be measured yet (18 subs give the 3 levels the floor needs)
  interval-minutes: 30
  # Most registered subs read per measurement; a master with more uses a fixed random subset of this many
  max-subs: 200
  # Masters measured at once, each using about one core; measurement waits while the stacker is working
  workers: 3
  # Write goal progress into ts_goal_progress in the scheduler database: off, dry-run (log what would be written) or on
  publish: "off"
  # About a minute after a master is measured or goals change (and hourly as a backstop), move a broadband filter's goal from SNR to depth once its master has a Gaia zero point, on active galaxy, cluster and dust projects, through a goal.edit command sent once per filter: off, dry-run (log the edits) or on
  depth-switch: "on"
# The dark backlog the observatory's Target Scheduler Darks instruction works through
darks:
  # Leave out darks taken on or after this date (YYYY-MM-DD, UTC) that the ingest check finds lit or off their setpoint; older darks only get the verdict recorded; empty records every verdict only
  reject-since: "2026-10-10"
  # Write the dark backlog into ts_dark_need in the scheduler database after each index scan: off, dry-run (log what would be written) or on
  publish: "off"
# Sub exposure lengths the system picks per target, filter and moon glare from the measured sky, read noise, overhead, star saturation, rejections and the dark library
sub-length:
  # Write the picked lengths into ts_sub_length in the scheduler database, which the plugin uses at exposure selection: off, dry-run (log what would be written) or on; on needs stacking.score-per-second
  publish: "off"
  # Put a dark set for each length the data proposes (one that would gain 5% SNR per hour or more but has no full dark set) on the dark backlog in ts_dark_need; off only shows the proposals
  new-lengths: false
  # Minutes between backstop recomputes; the lengths are worked out again about two minutes after subs are measured or triaged or the exposure plans change, and at most every ten minutes while subs keep arriving
  interval-minutes: 60
  # The shortest length allowed is picked if its SNR per hour is within this percent of the best allowed length; shorter subs lose less to a bad moment and saturate fewer stars
  tolerance-percent: 2
# The bias backlog and requested flats the observatory's Target Scheduler Darks and Flats instructions work through
calibration:
  # Write the bias backlog into ts_bias_need and open flat requests into ts_flat_request in the scheduler database after each index scan: off, dry-run (log what would be written) or on
  publish: "off"
# How many subs the stacker keeps under each Moon, by filter, Moon phase, Moon altitude and distance from the target, and by the target's altitude with the Moon down, fitted from its own verdicts for the plugin's weights and skips
moon-keep:
  # Write the fitted kept rates into ts_moon_keep and ts_alt_keep in the scheduler database, which the plugin uses to weigh and skip exposures by the Moon and by the target's altitude: off, dry-run (log what would be written) or on; nothing is written to a table until the scheduler has it
  publish: "on"
  # Hours between backstop refits; the kept rates are refitted about two minutes after the stacker's verdicts or the exposure plans change, and at most every ten minutes while subs keep arriving
  interval-hours: 24
# Comets and other moving targets: nightly JPL Horizons position tables for the plugin and the list of comets observable tonight
bodies:
  # Write each moving target's nightly position table into ts_body_position, which the plugin uses for visibility, centering and sub length, and its season table (one position and magnitude per night for a year) into ts_body_night, which the plugin counts its season from, in the scheduler database: off (no Horizons requests), dry-run (log what would be written) or on; nothing is fetched until the scheduler has the ts_target_body table
  publish: "on"
  # Minutes between rebuilding the position tables; tables already fetched for a night come from the cache
  interval-minutes: 60
  # JPL Horizons API
  horizons-url: "https://ssd.jpl.nasa.gov/api/horizons.api"
  # Minor Planet Center comet elements, for the list of comets observable tonight
  comet-elements-url: "https://www.minorplanetcenter.net/iau/MPCORB/CometEls.txt"
  # JPL SBDB query of every comet's M1 and K1, for the JPL magnitude estimate in the comet list
  comet-sbdb-url: "https://ssd-api.jpl.nasa.gov/sbdb_query.api?fields=pdes,full_name,M1,K1&sb-kind=c"
# Each night of a target with 3 or more accepted nights compared with its other nights for variable stars, supernovae, asteroids and anything new
discoveries:
  # Compare each settled night of every target with 3 or more accepted nights (per filter group: L, R, G and B together, each narrowband filter alone) against its other nights, check what changed against VSX, SkyBoT, ALeRCE and Fink, and store the candidates, cutouts and moving-object tracks
  enabled: false
  # Minutes between backstop checks for nights to compare; a master update starts a check about two minutes later
  interval-minutes: 10
  # Cores one comparison may use; comparisons run one at a time and wait while the stacker is working
  threads: 2
  # Most subs per filter stacked into a night's reference, taken from the other nights in turn
  reference-subs: 48
  # Nights from the last this many days are compared on their own; older nights only on request
  backfill-days: 30
  # Transient Name Server bot API key; empty skips TNS
  # tns-key: ""
  # Transient Name Server bot ID
  # tns-bot-id: ""
  # Transient Name Server bot name
  # tns-bot-name: ""
# One global set of scheduling settings for every Target Scheduler project, with each project's minimum time at the measured switching floor and its minimum altitude at the hard limit
scheduling:
  # Keep every project on the global scheduling settings and its automatic minimum time and minimum altitude through project.batchedit commands: off, dry-run (log the edits) or on
  auto: "off"
  # Hours between backstop runs; the values are worked out again about a minute after projects, targets, exposure plans or the global settings change (at most every five minutes), and when a manual edit's hold ends
  interval-hours: 1
# A daily Telegram report on the night that just ended: safe and imaged hours, subs kept and rejected, unsafe events and how fast the flap closed, dew, autofocus, guiding and camera, with each imaged target's current stack
morning-report:
  # Send the report once a day; a report missed while the stacker was down is sent when it comes back the same day
  enabled: false
  # Local time of day, HH:MM, the report is sent; each report covers the day before up to this time
  time: "11:00"
  # IANA time zone of the send time and of the times in the report
  timezone: "America/Chicago"
  # Label after every time in the report
  zone-label: "CT"
  # Loki holding the observatory's NINA logs, for the flap, unsafe events and guider errors, e.g. http://loki.monitoring:3100; empty leaves those not measured
  # loki-url: ""
  # Telegram bot token
  # telegram-token: "(secret)"
  # Telegram chat the report goes to
  # telegram-chat-id: ""
  # First night, as its evening date YYYY-MM-DD, whose report is sent; earlier nights never are, so turning the report on after the send time does not send that day's report; empty sends every night
  # first-night: ""
# A Telegram alert, through the morning report's bot and chat, as soon as a night comparison stores a high-confidence new find whose catalogue checks all succeeded, and a second look at its field
discovery-alerts:
  # Send one Telegram alert per new find (a run's finds together, a run with more than 5 as one summary), once per source across restarts and reruns; candidates already stored when this is first on are never alerted; needs the morning report's Telegram token and chat
  enabled: true
  # For each alerted find, add a Target Scheduler project that images its field again in the same filter group (at least 6 subs or 30 minutes) at high priority from now to the third night, record whether the find was seen again, and close the project once settled
  followup: true
  # Minutes between backstop looks for new finds and follow-up results; a stored comparison starts a look about 20 seconds later
  interval-minutes: 5
