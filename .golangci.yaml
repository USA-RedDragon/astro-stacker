version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gosec
        text: G404|G703
      - path: internal/(stacking/.*|server/(covers|public|subs|webui|discover|stacks|collabswitch)|publicframe/render(er)?|events/events|indexer/(indexer|runloop|recent)|siril/maincommand)_test\.go$
        linters:
          - testpackage
      - path: internal/(goals|goalmeasure|planning|astrometry|discoveries|vetting)/.*_test\.go$
        linters:
          - testpackage
      - path: internal/server/(planning|goalmask|objects|darkbacklog|calibration|discoveries)_test\.go$
        linters:
          - testpackage
      - path: internal/goals/measure\.go$
        linters:
          - gosec
        text: G404
      - path: internal/imagedata/fits\.go$
        linters:
          - gosec
        text: G115
      - path: internal/starcat/format\.go$
        linters:
          - gosec
        text: G115
      - path: internal/vetting/surveys/ztftile\.go$
        linters:
          - gosec
        text: G115
      - path: internal/starcat/mirror(_test)?\.go$
        linters:
          - gosec
        text: G401|G501
      - path: internal/publicframe/render\.go$
        linters:
          - gosec
        text: G404
      - path: internal/siril/siril\.go$
        linters:
          - gosec
        text: G204
      - path: internal/astrometry/solvefield\.go$
        linters:
          - gosec
        text: G204|G703
      - path: internal/stacking/coverbg\.go$
        linters:
          - gosec
        text: G204|G115
      - path: internal/stacking/(header|outputs|process)\.go$
        linters:
          - gosec
        text: G703
      - path: internal/horizonsurvey/(phd2|runner)\.go$
        linters:
          - gosec
        text: G204|G703
      - path: internal/horizonsurvey/sim/sim\.go$
        linters:
          - gosec
        text: G404
      - path: internal/(metrics/metrics|catalog/embedded|server/skyevents_internal_test|starcat/format|vetting/lc/bjd|vetting/period/(darkness|limbdark))\.go$
        linters:
          - gochecknoglobals
      - path: internal/publicframe/watermark\.go$
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_configulator\.go$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_configulator\.go$
