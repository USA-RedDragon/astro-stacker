version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gosec
        text: G404|G703
      - path: internal/(stacking/.*|server/(covers|public|subs)|publicframe/render(er)?|events/events|indexer/(indexer|runloop)|siril/maincommand)_test\.go$
        linters:
          - testpackage
      - path: internal/(stacking/(header|outputs|process)|publicframe/render|imagedata/fits|siril/siril)\.go$
        linters:
          - gosec
        text: G115|G204|G404|G703
      - path: internal/metrics/metrics\.go$
        linters:
          - gochecknoglobals
      - path: internal/publicframe/watermark\.go$
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_configulator\.go$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_configulator\.go$
